services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facetai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: facetai
      POSTGRES_PASSWORD: facetai
      POSTGRES_DB: facetai
    volumes:
      - facetai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facetai -d facetai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  facetai_pgdata:
